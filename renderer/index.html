<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Parental Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div id="banner" class="banner" role="alert" hidden></div>

    <div class="account-row">
      <span id="user-label" class="account-label">Konto dziecka:</span>
      <div id="user-picker" class="picker">
        <button type="button" id="user-button" class="picker-button"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="user-list"
                aria-labelledby="user-label user-button-text">
          <span id="user-button-text" class="picker-text"></span>
          <svg class="picker-chevron" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <ul id="user-list" class="picker-list" role="listbox" aria-labelledby="user-label"
            tabindex="-1" hidden></ul>
      </div>
    </div>

    <section class="card days-card" aria-label="Ustawienia dni tygodnia">
      <div class="grid grid-head" aria-hidden="true">
        <span>Dzień</span>
        <span class="center">Dostęp</span>
        <span>Od godz.</span>
        <span>Do godz.</span>
        <span>Limit (godz.)</span>
      </div>
      <div id="days"></div>
    </section>

    <p class="hint">
      W odznaczone dni komputer jest niedostępny.<br>
      Limit to łączny czas, jaki dziecko może spędzić przy komputerze w ciągu dnia.
    </p>

    <section class="card status-card" aria-label="Wykorzystanie dzisiaj">
      <p id="status-text" class="status-text">Wczytywanie…</p>
      <div class="progress" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="status-buttons">
        <button type="button" id="refresh-btn" class="btn">Odśwież</button>
      </div>
    </section>

    <footer class="footer">
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <button type="button" id="save-btn" class="btn btn-primary">Zapisz i zastosuj</button>
      <button type="button" id="close-btn" class="btn">Zamknij</button>
    </footer>
  </main>

  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal" role="alertdialog" aria-modal="true"
         aria-labelledby="modal-title" aria-describedby="modal-text">
      <div class="modal-body">
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-text" class="modal-text"></p>
      </div>
      <div class="modal-footer">
        <button type="button" id="modal-confirm" class="btn"></button>
        <button type="button" id="modal-cancel" class="btn btn-primary"></button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
